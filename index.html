<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyuomsVlvTt12Se7lnb1oMb-m9QgYqPqXTHKvVJn9nyRQyaoyqml0igzK_jzh_hcVSt/exec";

    let dbData = { total: 0, pria: 0, wanita: 0, kk: 0, ageCategory: { labels: [], values: [] }, generus: { labels: [], values: [], pria: [], wanita: [] }, marital: { labels: [], values: [] } };
    let financeData = { kas: { total: 0, pemasukan: 0, pengeluaran: 0 }, items: [] };
    
    // Objek global untuk menyimpan instance chart agar mudah dihancurkan sebelum dirender ulang
    const chartInstances = {};

    // Fungsi Toggle Tema Terang & Gelap
    function toggleTheme() {
      const html = document.documentElement;
      const currentTheme = html.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateThemeIcons(newTheme);
      renderCharts();
    }

    function updateThemeIcons(theme) {
      const iconLight = document.getElementById('theme-icon-light');
      const iconDark = document.getElementById('theme-icon-dark');
      if (theme === 'dark') {
        iconLight.classList.remove('hidden');
        iconDark.classList.add('hidden');
      } else {
        iconLight.classList.add('hidden');
        iconDark.classList.remove('hidden');
      }
    }

    // Inisialisasi tema tersimpan
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeIcons(savedTheme);

    function formatCurrency(num) {
      return 'Rp ' + (num || 0).toLocaleString('id-ID');
    }

    function showToast(title, message) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-title').textContent = title;
      document.getElementById('toast-message').textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 5000);
    }

    function openModal(title, content) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-content').innerHTML = content;
      document.getElementById('modal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('show');
    }

    function parseNumber(str) {
      if (!str) return 0;
      let cleaned = str.toString().trim().replace(/[^\d]/g, '');
      return parseInt(cleaned) || 0;
    }

    async function fetchDataFromGoogleSheets(isInitial = false) {
      try {
        const response = await fetch(SCRIPT_URL);
        const result = await response.json();
        
        if (!result.Database) throw new Error('Data sheet Database tidak ditemukan.');

        processData(result.Database, result.Keuangan || []);
        document.getElementById('last-update').textContent = new Date().toLocaleString('id-ID');
      } catch (error) {
        if (isInitial) {
          showToast('Gagal Sinkronisasi', error.message);
        }
      } finally {
        if (isInitial) {
          const loadingScreen = document.getElementById('loading-screen');
          if (loadingScreen) {
            loadingScreen.style.opacity = '0';
            loadingScreen.style.pointerEvents = 'none';
            setTimeout(() => loadingScreen.remove(), 500);
          }
        }
      }
    }

    function processData(rawDbRows, rawFinRows) {
      const database = rawDbRows.map(row => ({
        no: String(row.No || ''),
        nama: String(row.Nama || ''),
        usia: parseInt(row.Usia, 10) || 0,
        status1: String(row.Status || '').trim(),
        jk: String(row.JK || '').trim().toLowerCase(),
        ket: String(row.Ket || '')
      })).filter(row => row.nama || row.no);

      const keuanganParsed = rawFinRows.map((row, idx) => {
        const kredit = parseNumber(row.Kredit);
        const debit = parseNumber(row.Debit);
        const saldo = parseNumber(row.Saldo);
        return {
          namaKas: String(row.Kas || ('Kas ' + (idx + 1))),
          kredit: kredit,
          debit: debit,
          saldo: saldo > 0 ? saldo : (kredit - debit)
        };
      }).filter(row => row.namaKas || row.kredit || row.debit || row.saldo);

      const total = database.length;
      const isPria = (d) => ['l', 'pria', 'laki', 'lk', 'laki-laki', 'laki laki'].includes(d.jk) || d.jk.includes('laki');
      const isWanita = (d) => d.jk === 'p' || d.jk === 'wanita' || d.jk === 'perempuan';
      const isMarried = (d) => d.status1 === 'Kawin' || d.status1 === 'Nikah';

      const pria = database.filter(isPria).length;
      const wanita = database.filter(isWanita).length;

      const ageCategory = {
        'Balita': { total: 0, pria: 0, wanita: 0 },
        'Generus': { total: 0, pria: 0, wanita: 0 },
        'Dewasa': { total: 0, pria: 0, wanita: 0 },
        'Lansia': { total: 0, pria: 0, wanita: 0 }
      };

      const generusMap = {
        'PAUD (5-6 Tahun)': { total: 0, pria: 0, wanita: 0 },
        'Cabe Rawit (Kls 1-6 SD)': { total: 0, pria: 0, wanita: 0 },
        'Pra Remaja (SMP)': { total: 0, pria: 0, wanita: 0 },
        'Remaja (SMA)': { total: 0, pria: 0, wanita: 0 },
        'Pra Nikah (19+)': { total: 0, pria: 0, wanita: 0 }
      };

      database.forEach(d => {
        const usia = d.usia;
        const married = isMarried(d);
        let category = '';

        if (usia <= 4) {
          category = 'Balita';
        } else if (usia > 60) {
          category = 'Lansia';
        } else if (married) {
          category = 'Dewasa';
        } else {
          category = 'Generus';
          const isPriaCat = isPria(d);
          const isWanitaCat = isWanita(d);
          if (usia >= 5 && usia <= 6) {
            generusMap['PAUD (5-6 Tahun)'].total++;
            if (isPriaCat) generusMap['PAUD (5-6 Tahun)'].pria++;
            if (isWanitaCat) generusMap['PAUD (5-6 Tahun)'].wanita++;
          } else if (usia >= 7 && usia <= 12) {
            generusMap['Cabe Rawit (Kls 1-6 SD)'].total++;
            if (isPriaCat) generusMap['Cabe Rawit (Kls 1-6 SD)'].pria++;
            if (isWanitaCat) generusMap['Cabe Rawit (Kls 1-6 SD)'].wanita++;
          } else if (usia >= 13 && usia <= 15) {
            generusMap['Pra Remaja (SMP)'].total++;
            if (isPriaCat) generusMap['Pra Remaja (SMP)'].pria++;
            if (isWanitaCat) generusMap['Pra Remaja (SMP)'].wanita++;
          } else if (usia >= 16 && usia <= 18) {
            generusMap['Remaja (SMA)'].total++;
            if (isPriaCat) generusMap['Remaja (SMA)'].pria++;
            if (isWanitaCat) generusMap['Remaja (SMA)'].wanita++;
          } else if (usia >= 19) {
            generusMap['Pra Nikah (19+)'].total++;
            if (isPriaCat) generusMap['Pra Nikah (19+)'].pria++;
            if (isWanitaCat) generusMap['Pra Nikah (19+)'].wanita++;
          }
        }

        ageCategory[category].total++;
        if (isPria(d)) ageCategory[category].pria++;
        if (isWanita(d)) ageCategory[category].wanita++;
      });

      let countKawin = 0, countBelumKawin = 0, countJanda = 0, countDuda = 0;
      database.forEach(d => {
        const status = (d.status1 || '').toLowerCase();
        if (status.includes('kawin') || status.includes('nikah')) {
          if (status.includes('belum')) countBelumKawin++;
          else countKawin++;
        } else if (status.includes('janda')) countJanda++;
        else if (status.includes('duda')) countDuda++;
        else if (status.includes('lajang') || status.includes('single')) countBelumKawin++;
      });

      dbData.database = database;
      dbData.total = total;
      dbData.pria = pria;
      dbData.wanita = wanita;

      dbData.ageCategory = {
        labels: ['Balita', 'Generus', 'Dewasa', 'Lansia'],
        values: [ageCategory['Balita'].total, ageCategory['Generus'].total, ageCategory['Dewasa'].total, ageCategory['Lansia'].total],
        pria: [ageCategory['Balita'].pria, ageCategory['Generus'].pria, ageCategory['Dewasa'].pria, ageCategory['Lansia'].pria],
        wanita: [ageCategory['Balita'].wanita, ageCategory['Generus'].wanita, ageCategory['Dewasa'].wanita, ageCategory['Lansia'].wanita]
      };

      const generusLabels = Object.keys(generusMap);
      dbData.generus = {
        labels: generusLabels,
        values: generusLabels.map(l => generusMap[l].total),
        pria: generusLabels.map(l => generusMap[l].pria),
        wanita: generusLabels.map(l => generusMap[l].wanita)
      };

      const rawMaritalLabels = ['Kawin', 'Belum Kawin', 'Janda', 'Duda'];
      const rawMaritalValues = [countKawin, countBelumKawin, countJanda, countDuda];
      const filteredMaritalLabels = [], filteredMaritalValues = [];
      for (let i = 0; i < rawMaritalValues.length; i++) {
        if (rawMaritalValues[i] > 0) {
          filteredMaritalLabels.push(rawMaritalLabels[i]);
          filteredMaritalValues.push(rawMaritalValues[i]);
        }
      }
      dbData.marital = { labels: filteredMaritalLabels, values: filteredMaritalValues };

      if (keuanganParsed.length) {
        let sumSaldo = 0, sumKredit = 0, sumDebit = 0;
        keuanganParsed.forEach(k => {
          sumSaldo += (k.saldo || 0);
          sumKredit += (k.kredit || 0);
          sumDebit += (k.debit || 0);
        });
        financeData.kas = { total: sumSaldo, pemasukan: sumKredit, pengeluaran: sumDebit };
        financeData.items = keuanganParsed;
      }

      dbData.kk = Math.ceil(countKawin / 2);
      updateKPICards();
      renderCharts();
    }

    function updateKPICards() {
      document.getElementById('kpi-total').textContent = dbData.total;
      document.getElementById('kpi-kk').textContent = dbData.kk || 0;
      document.getElementById('kpi-pria').textContent = dbData.pria;
      document.getElementById('kpi-wanita').textContent = dbData.wanita;
      document.getElementById('kpi-generus').textContent = dbData.ageCategory.values[1];

      document.getElementById('fin-kas').textContent = formatCurrency(financeData.kas.total);
      document.getElementById('fin-pemasukan').textContent = formatCurrency(financeData.kas.pemasukan);
      document.getElementById('fin-pengeluaran').textContent = formatCurrency(financeData.kas.pengeluaran);

      updateGenderRatio();
    }

    function updateGenderRatio() {
      const total = dbData.total || 1;
      const priaPct = Math.round((dbData.pria / total) * 100);
      const wanitaPct = 100 - priaPct;
      const ratioBar = document.getElementById('ratio-bar');
      if (ratioBar) {
        ratioBar.innerHTML = `
          <div class="h-full bg-blue-500 rounded-l-full flex items-center justify-center transition-all duration-500" style="width: ${priaPct}%;"></div>
          <div class="h-full bg-rose-400 rounded-r-full flex items-center justify-center transition-all duration-500" style="width: ${wanitaPct}%;"></div>
        `;
      }
      document.getElementById('ratio-pria').textContent = priaPct + '%';
      document.getElementById('ratio-wanita').textContent = wanitaPct + '%';
    }

    // Fungsi helper untuk menghancurkan chart dengan aman sebelum digambar ulang
    function safeDestroy(chartKey) {
      if (chartInstances[chartKey]) {
        chartInstances[chartKey].destroy();
        delete chartInstances[chartKey];
      }
    }

    function renderCharts() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const textColor = isDark ? '#94a3b8' : '#475569';
      const gridColor = isDark ? 'rgba(148, 163, 184, 0.1)' : '#f1f5f9';

      if (!Chart.registry.plugins.get('datalabels')) {
        Chart.register(ChartDataLabels);
      }

      // 1. Kategori Usia Jamaah
      safeDestroy('ageCategory');
      chartInstances.ageCategory = new Chart(document.getElementById('ageCategoryChart').getContext('2d'), {
        type: 'bar',
        data: {
          labels: dbData.ageCategory.labels,
          datasets: [{ data: dbData.ageCategory.values, backgroundColor: ['#fb7185', '#a78bfa', '#38bdf8', '#fbbf24'], borderRadius: 8 }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          layout: { padding: { top: 20 } },
          plugins: {
            legend: { display: false },
            datalabels: { color: isDark ? '#f8fafc' : '#1e293b', font: { weight: 'bold', size: 11 }, anchor: 'end', align: 'top' }
          },
          scales: {
            y: { beginAtZero: true, grid: { color: gridColor }, ticks: { color: textColor }, grace: '20%' },
            x: { grid: { display: false }, ticks: { color: textColor } }
          }
        }
      });

      // 2. Status Pernikahan
      safeDestroy('marital');
      chartInstances.marital = new Chart(document.getElementById('maritalChart').getContext('2d'), {
        type: 'bar',
        data: {
          labels: dbData.marital.labels,
          datasets: [{ data: dbData.marital.values, backgroundColor: ['#34d399', '#60a5fa', '#fb7185', '#a78bfa'], borderRadius: 8 }]
        },
        options: {
          indexAxis: 'y', responsive: true, maintainAspectRatio: false,
          layout: { padding: { right: 35 } },
          plugins: {
            legend: { display: false },
            datalabels: { color: isDark ? '#f8fafc' : '#1e293b', font: { weight: 'bold', size: 11 }, anchor: 'end', align: 'right' }
          },
          scales: {
            x: { beginAtZero: true, grid: { color: gridColor }, ticks: { color: textColor }, grace: '20%' },
            y: { grid: { display: false }, ticks: { color: textColor } }
          }
        }
      });

      // 3. Generus Donut
      safeDestroy('generus');
      chartInstances.generus = new Chart(document.getElementById('generusChart').getContext('2d'), {
        type: 'doughnut',
        data: {
          labels: dbData.generus.labels.map(l => l.replace(/\s*\([^)]+\)/, '')),
          datasets: [{ data: dbData.generus.values, backgroundColor: ['#fb7185', '#a78bfa', '#38bdf8', '#fbbf24', '#34d399'], borderWidth: 2, borderColor: isDark ? '#131b2e' : '#ffffff' }]
        },
        options: {
          responsive: true, maintainAspectRatio: false, cutout: '65%',
          plugins: {
            legend: { position: 'bottom', labels: { color: textColor, boxWidth: 12, font: { size: 11 } } },
            datalabels: { color: '#ffffff', font: { weight: 'bold', size: 10 } }
          }
        }
      });

      // 4. Generus Detail Bar
      safeDestroy('generusDetail');
      chartInstances.generusDetail = new Chart(document.getElementById('generusDetailChart').getContext('2d'), {
        type: 'bar',
        data: {
          labels: dbData.generus.labels,
          datasets: [
            { label: 'Laki-laki', data: dbData.generus.pria, backgroundColor: '#60a5fa', borderRadius: 6 },
            { label: 'Perempuan', data: dbData.generus.wanita, backgroundColor: '#fb7185', borderRadius: 6 }
          ]
        },
        options: {
          indexAxis: 'y', responsive: true, maintainAspectRatio: false,
          layout: { padding: { right: 25 } },
          plugins: {
            legend: { position: 'top', labels: { color: textColor, boxWidth: 12 } },
            datalabels: {
              color: isDark ? '#f8fafc' : '#1e293b',
              font: { weight: 'bold', size: 11 },
              anchor: 'end',
              align: 'right',
              formatter: (value) => value > 0 ? value : ''
            }
          },
          scales: {
            x: { beginAtZero: true, grid: { color: gridColor }, ticks: { color: textColor }, grace: '15%' },
            y: { grid: { display: false }, ticks: { color: textColor, font: { size: 11, weight: '500' } } }
          }
        }
      });

      const kasLabels = financeData.items.map(i => i.namaKas);
      const kasSaldoValues = financeData.items.map(i => i.saldo);

      // 5. Grafik Ringkasan Kas
      safeDestroy('kas');
      chartInstances.kas = new Chart(document.getElementById('kasChart').getContext('2d'), {
        type: 'bar',
        data: {
          labels: kasLabels,
          datasets: [{ label: 'Total Saldo', data: kasSaldoValues, backgroundColor: '#0ea5e9', borderRadius: 8 }]
        },
        options: {
          responsive: true, maintainAspectRatio: false, indexAxis: 'y',
          layout: { padding: { right: 35 } },
          onClick: (event, elements) => {
            if (elements.length > 0) {
              const index = elements[0].index;
              const item = financeData.items[index];
              if (item) {
                const content = `
                  <div class="space-y-3 text-sm">
                    <div class="flex justify-between items-center border-b pb-2" style="border-color: var(--border-color);">
                      <span style="color: var(--text-secondary);">Nama Kas</span>
                      <span class="font-bold text-sky-500">${item.namaKas}</span>
                    </div>
                    <div class="flex justify-between items-center border-b pb-2" style="border-color: var(--border-color);">
                      <span style="color: var(--text-secondary);">Total Pemasukan</span>
                      <span class="font-semibold text-emerald-500">${formatCurrency(item.kredit)}</span>
                    </div>
                    <div class="flex justify-between items-center border-b pb-2" style="border-color: var(--border-color);">
                      <span style="color: var(--text-secondary);">Total Pengeluaran</span>
                      <span class="font-semibold text-rose-500">${formatCurrency(item.debit)}</span>
                    </div>
                    <div class="flex justify-between items-center pt-1">
                      <span class="font-medium" style="color: var(--text-secondary);">Sisa Saldo</span>
                      <span class="font-bold text-base" style="color: var(--text-primary);">${formatCurrency(item.saldo)}</span>
                    </div>
                  </div>
                `;
                openModal('Rincian Kas: ' + item.namaKas, content);
              }
            }
          },
          plugins: {
            legend: { display: false },
            datalabels: {
              color: isDark ? '#f8fafc' : '#1e293b',
              font: { weight: 'bold', size: 11 },
              anchor: 'end',
              align: 'right',
              formatter: (val) => (val >= 1000000 ? (val/1000000).toFixed(1) + 'Jt' : val)
            }
          },
          scales: {
            x: { grid: { color: gridColor }, ticks: { color: textColor }, grace: '15%' },
            y: { grid: { display: false }, ticks: { color: textColor, font: { size: 11, weight: '500' } } }
          }
        }
      });
    }

    document.addEventListener('DOMContentLoaded', async () => {
      AOS.init({ duration: 800, once: true, easing: 'ease-out-cubic' });
      await fetchDataFromGoogleSheets(true);

      // Auto-update / Live sync setiap 30 detik secara background
      setInterval(() => {
        fetchDataFromGoogleSheets(false);
      }, 30000);
    });
  </script>
